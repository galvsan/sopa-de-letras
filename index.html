<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sopa de Letras Mágica - Aprende Jugando</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente infantil muy redondeada y legible -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100dvh;
            max-height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #E0F2FE 0%, #FEF3C7 50%, #FCE7F3 100%);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Animaciones divertidas para niños */
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.12); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes foundPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.18); }
            75% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        @keyframes pulseGentle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes hintBlink {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.8); }
            50% { transform: scale(1.14); box-shadow: 0 0 0 10px rgba(250, 204, 21, 0); background-color: #FEF08A; border-color: #EAB308; }
        }

        .animate-bounce-in {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-found-pop {
            animation: foundPop 0.45s ease-out forwards;
        }

        .animate-pulse-gentle {
            animation: pulseGentle 2s infinite ease-in-out;
        }

        .animate-hint {
            animation: hintBlink 0.7s ease-in-out 2;
        }

        /* Contenedor de cuadrícula responsivo sin desbordamiento */
        .board-wrapper {
            width: min(86vw, 50dvh);
            height: min(86vw, 50dvh);
        }

        @media (min-width: 1024px) {
            .board-wrapper {
                width: min(52vw, 76dvh);
                height: min(52vw, 76dvh);
            }
        }

        /* Estilos de celda de la cuadrícula */
        .letter-cell {
            width: 100%;
            height: 100%;
            font-size: clamp(1.25rem, 4.2vmin, 2.5rem);
            transition: transform 0.12s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            touch-action: none;
        }

        .letter-cell:active {
            transform: scale(0.92);
        }

        /* Canvas de confeti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="h-[100dvh] max-h-[100dvh] overflow-hidden flex flex-col justify-between p-2 sm:p-4 text-slate-800">

    <!-- Canvas para celebración de confeti -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Cabecera superior compacta -->
    <header class="w-full max-w-5xl mx-auto shrink-0 flex items-center justify-between gap-2 bg-white/95 backdrop-blur-sm px-3 py-2 sm:px-5 sm:py-2.5 rounded-2xl sm:rounded-3xl shadow-md border-2 sm:border-4 border-sky-200">
        <!-- Contador de estrellas de la partida y acumuladas -->
        <div class="flex items-center gap-2">
            <div class="flex items-center gap-1.5 bg-amber-100 px-3 py-1 sm:px-4 sm:py-1.5 rounded-xl sm:rounded-2xl border-2 border-amber-300">
                <span class="text-lg sm:text-2xl">⭐</span>
                <span id="round-progress" class="text-lg sm:text-2xl font-bold text-amber-600">0/4</span>
            </div>
            <div class="hidden sm:flex items-center gap-1 bg-yellow-50 px-3 py-1.5 rounded-2xl border-2 border-yellow-200 text-amber-700 font-bold text-base" title="Estrellas totales">
                <span>🏆</span>
                <span id="star-count">0</span>
            </div>
        </div>

        <!-- Título amigable -->
        <h1 class="text-base sm:text-2xl md:text-3xl font-bold text-sky-600 tracking-wide text-center truncate">
            Sopa de Letras Mágica
        </h1>

        <!-- Controles: Pista, Voz y Nueva Partida -->
        <div class="flex items-center gap-1.5 sm:gap-2.5">
            <button id="btn-hint" onclick="giveVisualHint()" aria-label="Pista luminosa" title="Ver pista"
                class="p-2 sm:p-2.5 bg-amber-100 hover:bg-amber-200 active:scale-95 text-amber-700 rounded-xl sm:rounded-2xl border-2 border-amber-300 shadow-sm transition flex items-center justify-center text-lg sm:text-2xl">
                💡
            </button>
            <button id="btn-sound" onclick="toggleSound()" aria-label="Activar o desactivar sonido"
                class="p-2 sm:p-2.5 bg-indigo-100 hover:bg-indigo-200 active:scale-95 text-indigo-700 rounded-xl sm:rounded-2xl border-2 border-indigo-300 shadow-sm transition flex items-center justify-center text-lg sm:text-2xl">
                🔊
            </button>
            <button id="btn-new-game" onclick="startNewGame()"
                class="px-3 py-2 sm:px-4 sm:py-2.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold rounded-xl sm:rounded-2xl border-b-4 border-emerald-700 shadow-sm transition flex items-center gap-1.5 text-sm sm:text-lg">
                <span>🔄</span>
                <span>Nuevas</span>
            </button>
        </div>
    </header>

    <!-- Área Principal del Juego (se ajusta dinámicamente al alto disponible) -->
    <main class="w-full max-w-5xl mx-auto flex-1 min-h-0 flex flex-col lg:flex-row items-center justify-evenly lg:justify-center gap-2 sm:gap-4 lg:gap-8 py-1">
        
        <!-- Cuadrícula de Sopa de Letras 6x6 -->
        <section class="flex flex-col items-center justify-center shrink-0">
            <div class="board-wrapper bg-white p-2 sm:p-3.5 rounded-[1.5rem] sm:rounded-[2rem] shadow-xl border-4 border-amber-300 flex items-center justify-center">
                <div id="grid-container" class="grid grid-cols-6 grid-rows-6 gap-1.5 sm:gap-2 w-full h-full">
                    <!-- Las 36 celdas de letras se generan dinámicamente aquí -->
                </div>
            </div>
        </section>

        <!-- Panel de Tarjetas Objetivo (4 columnas en móvil, columna vertical en escritorio) -->
        <section class="w-full lg:w-80 xl:w-96 shrink-0 flex flex-col gap-1.5 sm:gap-2.5">
            <div class="hidden sm:flex items-center justify-between bg-white/85 px-3.5 py-1.5 rounded-2xl border-2 border-purple-200 shadow-sm">
                <p class="text-sm sm:text-base font-semibold text-purple-700">
                    👆 Toca un dibujo para oírlo
                </p>
                <span class="text-xs font-bold text-slate-500">➡️ / ⬇️</span>
            </div>

            <div id="target-cards" class="grid grid-cols-4 lg:grid-cols-1 gap-1.5 sm:gap-2.5">
                <!-- Las 4 tarjetas se generan dinámicamente aquí -->
            </div>
        </section>

    </main>

    <!-- Modal de Victoria / Celebración -->
    <div id="victory-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-40">
        <div class="bg-white rounded-[2.5rem] p-6 sm:p-8 max-w-sm sm:max-w-md w-full text-center shadow-2xl border-8 border-amber-300 animate-bounce-in">
            <div class="text-5xl sm:text-7xl mb-2">🏆🎉</div>
            <h2 class="text-3xl sm:text-4xl font-bold text-amber-500 mb-1">¡LO LOGRASTE!</h2>
            <p class="text-base sm:text-xl text-slate-600 font-medium mb-4">
                ¡Encontraste todas las palabras!
            </p>
            
            <div class="flex justify-center gap-2 text-3xl sm:text-4xl mb-5">
                <span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span>
            </div>

            <button onclick="startNewGame()"
                class="w-full py-3.5 px-6 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 active:scale-95 text-white text-xl sm:text-2xl font-bold rounded-3xl border-b-8 border-teal-700 shadow-xl transition animate-pulse-gentle flex items-center justify-center gap-3">
                <span>🎮</span>
                <span>Jugar otra vez</span>
            </button>
        </div>
    </div>

    <script>
        /**
         * BANCO DE 36 PALABRAS EDUCATIVAS EN ESPAÑOL (3 y 4 letras)
         * Claras, fonéticas, familiares y con emojis muy reconocibles para 4 años.
         */
        const WORD_BANK = [
            { word: "SOL", emoji: "☀️" },
            { word: "OSO", emoji: "🐻" },
            { word: "PAN", emoji: "🍞" },
            { word: "MAR", emoji: "🌊" },
            { word: "LUZ", emoji: "💡" },
            { word: "PEZ", emoji: "🐟" },
            { word: "UVA", emoji: "🍇" },
            { word: "PIE", emoji: "🦶" },
            { word: "OJO", emoji: "👁️" },
            { word: "FLOR", emoji: "🌻" },
            { word: "GATO", emoji: "🐱" },
            { word: "CASA", emoji: "🏠" },
            { word: "LUNA", emoji: "🌙" },
            { word: "PATO", emoji: "🦆" },
            { word: "RANA", emoji: "🐸" },
            { word: "TREN", emoji: "🚂" },
            { word: "BOLA", emoji: "⚽" },
            { word: "DADO", emoji: "🎲" },
            { word: "PERA", emoji: "🍐" },
            { word: "MANO", emoji: "✋" },
            { word: "PIES", emoji: "👣" },
            { word: "NUBE", emoji: "☁️" },
            { word: "VACA", emoji: "🐮" },
            { word: "LEON", emoji: "🦁" },
            { word: "MONO", emoji: "🐵" },
            { word: "LOBO", emoji: "🐺" },
            { word: "FOCA", emoji: "🦭" },
            { word: "BOTA", emoji: "👢" },
            { word: "COPA", emoji: "🏆" },
            { word: "MESA", emoji: "🪑" },
            { word: "TAZA", emoji: "☕" },
            { word: "VASO", emoji: "🥛" },
            { word: "SOPA", emoji: "🍲" },
            { word: "MIEL", emoji: "🍯" },
            { word: "COCO", emoji: "🥥" },
            { word: "KIWI", emoji: "🥝" },
            { word: "AUTO", emoji: "🚗" },
            { word: "BICI", emoji: "🚲" },
            { word: "MOTO", emoji: "🏍️" },
            { word: "NAVE", emoji: "🚀" },
            { word: "LAGO", emoji: "🏞️" },
            { word: "ISLA", emoji: "🏝️" },
            { word: "HOJA", emoji: "🍃" }
        ];

        // Colores pastel vibrantes distintos para cada palabra encontrada
        const WORD_COLORS = [
            { bg: "bg-emerald-400", border: "border-emerald-600", text: "text-white", cardBg: "bg-emerald-100", cardBorder: "border-emerald-400" },
            { bg: "bg-sky-400", border: "border-sky-600", text: "text-white", cardBg: "bg-sky-100", cardBorder: "border-sky-400" },
            { bg: "bg-orange-400", border: "border-orange-600", text: "text-white", cardBg: "bg-orange-100", cardBorder: "border-orange-400" },
            { bg: "bg-rose-400", border: "border-rose-600", text: "text-white", cardBg: "bg-rose-100", cardBorder: "border-rose-400" }
        ];

        // Configuración de la cuadrícula
        const GRID_SIZE = 6;
        const WORDS_PER_GAME = 4;
        const ALPHABET = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";

        // Estado global del juego
        let grid = [];
        let placedWords = [];
        let foundWords = new Set();
        let selectedCells = [];
        let isDragging = false;
        let dragMoved = false;
        let startDragCell = null;
        let totalStars = 0;
        let soundEnabled = true;
        let lastUsedWords = new Set();

        // Contexto de Audio Web API
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type = 'sine', duration = 0.15, delay = 0) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);

                gain.gain.setValueAtTime(0.18, audioCtx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(audioCtx.currentTime + delay);
                osc.stop(audioCtx.currentTime + delay + duration);
            } catch (e) {
                console.warn("Audio no disponible:", e);
            }
        }

        function playPopSound(step = 0) {
            const notes = [330, 392, 440, 523.25];
            playTone(notes[step % notes.length], 'triangle', 0.12);
        }

        function playSuccessMelody() {
            const melody = [523.25, 659.25, 783.99, 1046.50];
            melody.forEach((freq, idx) => {
                playTone(freq, 'sine', 0.22, idx * 0.08);
            });
        }

        function playVictoryFanfare() {
            const notes = [523.25, 523.25, 659.25, 783.99, 659.25, 1046.50];
            const times = [0, 0.12, 0.24, 0.36, 0.52, 0.68];
            notes.forEach((freq, idx) => {
                playTone(freq, 'triangle', 0.3, times[idx]);
            });
        }

        function speakText(text) {
            if (!soundEnabled || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 0.92;
                utterance.pitch = 1.15;
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.warn("Síntesis de voz no soportada:", e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-sound');
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) {
                playPopSound(2);
                speakText("Sonido activado");
            }
        }

        function pickRandomWords() {
            const uniquePool = [];
            const seen = new Set();
            for (const item of WORD_BANK) {
                if (!seen.has(item.word)) {
                    seen.add(item.word);
                    uniquePool.push(item);
                }
            }

            let candidates = uniquePool.filter(item => !lastUsedWords.has(item.word));
            if (candidates.length < WORDS_PER_GAME) {
                candidates = [...uniquePool];
            }

            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }

            const chosen = candidates.slice(0, WORDS_PER_GAME);
            lastUsedWords = new Set(chosen.map(c => c.word));
            return chosen;
        }

        function generateBoard(wordsList) {
            let success = false;
            let attempts = 0;

            while (!success && attempts < 120) {
                attempts++;
                grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(''));
                placedWords = [];
                let allPlaced = true;

                const directions = ['H', 'V', 'H', 'V'].sort(() => Math.random() - 0.5);

                for (let wIdx = 0; wIdx < wordsList.length; wIdx++) {
                    const wordObj = wordsList[wIdx];
                    const word = wordObj.word;
                    const preferredDir = directions[wIdx];
                    const dirOrder = preferredDir === 'H' ? ['H', 'V'] : ['V', 'H'];

                    let placed = false;

                    for (const dir of dirOrder) {
                        if (placed) break;

                        const positions = [];
                        for (let r = 0; r < GRID_SIZE; r++) {
                            for (let c = 0; c < GRID_SIZE; c++) {
                                if (dir === 'H' && c + word.length <= GRID_SIZE) {
                                    positions.push({ r, c });
                                } else if (dir === 'V' && r + word.length <= GRID_SIZE) {
                                    positions.push({ r, c });
                                }
                            }
                        }

                        positions.sort(() => Math.random() - 0.5);

                        for (const pos of positions) {
                            let canPlace = true;
                            const coords = [];

                            for (let i = 0; i < word.length; i++) {
                                const nr = dir === 'V' ? pos.r + i : pos.r;
                                const nc = dir === 'H' ? pos.c + i : pos.c;
                                const existingChar = grid[nr][nc];

                                if (existingChar !== '' && existingChar !== word[i]) {
                                    canPlace = false;
                                    break;
                                }
                                coords.push({ r: nr, c: nc });
                            }

                            if (canPlace) {
                                coords.forEach((coord, i) => {
                                    grid[coord.r][coord.c] = word[i];
                                });
                                placedWords.push({
                                    ...wordObj,
                                    colorIndex: wIdx,
                                    coords: coords,
                                    dir: dir
                                });
                                placed = true;
                                break;
                            }
                        }
                    }

                    if (!placed) {
                        allPlaced = false;
                        break;
                    }
                }

                if (allPlaced) {
                    success = true;
                }
            }

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
                    }
                }
            }
        }

        /**
         * Ilumina brevemente la primera letra de una palabra pendiente como pista suave
         */
        function highlightWordStart(wordObj) {
            if (!wordObj || foundWords.has(wordObj.word)) return;
            const firstCoord = wordObj.coords[0];
            const cellElem = document.querySelector(`[data-r="${firstCoord.r}"][data-c="${firstCoord.c}"]`);
            if (cellElem) {
                cellElem.classList.remove('animate-hint');
                void cellElem.offsetWidth;
                cellElem.classList.add('animate-hint');
            }
        }

        function giveVisualHint() {
            const pending = placedWords.find(pw => !foundWords.has(pw.word));
            if (pending) {
                playPopSound(3);
                speakText(`Busca ${pending.word.toLowerCase()}`);
                highlightWordStart(pending);
            }
        }

        /**
         * Renderiza las 4 tarjetas objetivo de forma compacta en móvil (4 columnas) y amplia en escritorio
         */
        function renderTargetCards() {
            const container = document.getElementById('target-cards');
            container.innerHTML = '';

            placedWords.forEach((item) => {
                const isFound = foundWords.has(item.word);
                const color = WORD_COLORS[item.colorIndex];

                const card = document.createElement('button');
                card.type = 'button';
                card.onclick = () => {
                    initAudio();
                    speakText(item.word.toLowerCase());
                    if (!isFound) {
                        highlightWordStart(item);
                    }
                };

                card.className = `flex flex-col lg:flex-row items-center justify-center lg:justify-between p-1.5 sm:p-2.5 lg:px-4 lg:py-3 rounded-2xl lg:rounded-3xl border-2 sm:border-4 transition-all shadow-sm active:scale-95 ${
                    isFound
                        ? `${color.cardBg} ${color.cardBorder}`
                        : 'bg-white border-slate-200 hover:border-sky-300'
                }`;

                card.innerHTML = `
                    <div class="flex flex-col lg:flex-row items-center gap-0.5 sm:gap-1 lg:gap-3">
                        <span class="text-2xl sm:text-4xl lg:text-4xl leading-none drop-shadow-sm">${item.emoji}</span>
                        <span class="font-bold text-sm sm:text-lg lg:text-2xl tracking-wider ${
                            isFound ? 'text-slate-800' : 'text-slate-700'
                        }">${item.word}</span>
                    </div>
                    <div class="text-sm sm:text-lg lg:text-2xl leading-none mt-0.5 lg:mt-0">
                        ${isFound ? '✅⭐' : '🔊'}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        /**
         * Renderiza la cuadrícula 6x6 interactiva
         */
        function renderGrid(recentlyFoundCoords = []) {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.textContent = grid[r][c];

                    const foundWordObj = placedWords.find(pw =>
                        foundWords.has(pw.word) &&
                        pw.coords.some(coord => coord.r === r && coord.c === c)
                    );

                    const isSelected = selectedCells.some(sc => sc.r === r && sc.c === c);
                    const isJustFound = recentlyFoundCoords.some(fc => fc.r === r && fc.c === c);

                    let cellClasses = 'letter-cell flex items-center justify-center rounded-xl sm:rounded-2xl font-bold border-b-4 cursor-pointer select-none ';

                    if (isSelected) {
                        cellClasses += 'bg-amber-300 border-amber-500 text-slate-900 scale-105 shadow-md z-10';
                    } else if (foundWordObj) {
                        const color = WORD_COLORS[foundWordObj.colorIndex];
                        cellClasses += `${color.bg} ${color.border} ${color.text} shadow-sm ${isJustFound ? 'animate-found-pop' : ''}`;
                    } else {
                        cellClasses += 'bg-sky-50 hover:bg-sky-100 border-sky-200 text-slate-700';
                    }

                    cell.className = cellClasses;

                    cell.addEventListener('pointerdown', (e) => handlePointerDown(e, r, c));

                    container.appendChild(cell);
                }
            }
        }

        /**
         * DETECCIÓN INFALIBLE: Soporta TANTO arrastrar el dedo COMO tocar letra por letra
         */
        function handlePointerDown(e, r, c) {
            e.preventDefault();
            initAudio();

            isDragging = true;
            dragMoved = false;
            startDragCell = { r, c };

            // Si ya había celdas seleccionadas (modo toque letra a letra)
            if (selectedCells.length > 0) {
                const last = selectedCells[selectedCells.length - 1];

                // Si vuelve a tocar la última celda seleccionada, deshace ese toque
                if (last.r === r && last.c === c) {
                    selectedCells.pop();
                    renderGrid();
                    return;
                }

                // Si toca la siguiente celda adyacente en línea recta (horizontal o vertical)
                if (isValidNextCell(r, c)) {
                    selectedCells.push({ r, c });
                    playPopSound(selectedCells.length - 1);
                    renderGrid();
                    // Valida inmediatamente por si acaba de completar la palabra tocando letra a letra
                    validateSelectedCells(false);
                    return;
                }
            }

            // Si toca una celda suelta que no continúa una línea válida, empieza una nueva selección limpia aquí
            selectedCells = [{ r, c }];
            playPopSound(0);
            renderGrid();
        }

        // Seguimiento continuo del dedo o ratón mientras arrastra por encima de la cuadrícula
        document.getElementById('grid-container').addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            e.preventDefault();

            const elem = document.elementFromPoint(e.clientX, e.clientY);
            if (elem && elem.dataset && elem.dataset.r !== undefined) {
                const r = parseInt(elem.dataset.r, 10);
                const c = parseInt(elem.dataset.c, 10);

                if (startDragCell && (r !== startDragCell.r || c !== startDragCell.c)) {
                    dragMoved = true;
                }

                extendDragSelection(r, c);
            }
        });

        window.addEventListener('pointerup', () => {
            if (!isDragging) return;
            isDragging = false;

            // Validar tanto al soltar el arrastre como al terminar el toque
            if (dragMoved) {
                validateSelectedCells(true);
            } else {
                validateSelectedCells(false);
            }
        });

        /**
         * Extiende la selección en línea recta durante un arrastre (horizontal o vertical)
         */
        function extendDragSelection(r, c) {
            if (selectedCells.length === 0) return;

            // Permitir retroceder el dedo si el niño se pasó una letra
            if (selectedCells.length >= 2) {
                const prev = selectedCells[selectedCells.length - 2];
                if (prev.r === r && prev.c === c) {
                    selectedCells.pop();
                    renderGrid();
                    return;
                }
            }

            if (isValidNextCell(r, c)) {
                selectedCells.push({ r, c });
                playPopSound(selectedCells.length - 1);
                renderGrid();
                // Validación instantánea también durante el arrastre si ya coincidió
                validateSelectedCells(false);
            }
        }

        /**
         * Comprueba si (r, c) continúa en línea recta horizontal o vertical desde selectedCells
         */
        function isValidNextCell(r, c) {
            if (selectedCells.length === 0) return true;
            if (selectedCells.some(sc => sc.r === r && sc.c === c)) return false;

            const first = selectedCells[0];
            const last = selectedCells[selectedCells.length - 1];

            if (selectedCells.length === 1) {
                const isHorizontal = (r === first.r && Math.abs(c - first.c) === 1);
                const isVertical = (c === first.c && Math.abs(r - first.r) === 1);
                return isHorizontal || isVertical;
            } else {
                const stepR = selectedCells[1].r - first.r;
                const stepC = selectedCells[1].c - first.c;
                return (r === last.r + stepR) && (c === last.c + stepC);
            }
        }

        /**
         * Comprueba si las letras seleccionadas coinciden con alguna palabra pendiente (normal o inversa)
         */
        function validateSelectedCells(clearIfNoMatch = false) {
            if (selectedCells.length < 3) return false;

            const forwardStr = selectedCells.map(sc => grid[sc.r][sc.c]).join('');
            const backwardStr = forwardStr.split('').reverse().join('');

            const matched = placedWords.find(pw =>
                !foundWords.has(pw.word) &&
                (pw.word === forwardStr || pw.word === backwardStr)
            );

            if (matched) {
                // ¡Palabra encontrada!
                foundWords.add(matched.word);
                const winningCoords = [...selectedCells];
                selectedCells = [];
                isDragging = false;

                // Actualizar contadores de estrellas
                totalStars++;
                document.getElementById('star-count').textContent = totalStars;
                document.getElementById('round-progress').textContent = `${foundWords.size}/${WORDS_PER_GAME}`;

                playSuccessMelody();
                renderTargetCards();
                renderGrid(winningCoords);

                if (foundWords.size === WORDS_PER_GAME) {
                    speakText(`¡Muy bien! ¡Has encontrado ${matched.word.toLowerCase()}! ¡Completaste todas!`);
                    setTimeout(() => {
                        showVictory();
                    }, 850);
                } else {
                    speakText(`¡Muy bien! ¡Has encontrado ${matched.word.toLowerCase()}!`);
                }
                return true;
            }

            // Si terminó un arrastre largo y no coincidió, limpiar la selección para no estorbar
            if (clearIfNoMatch && selectedCells.length > 1) {
                setTimeout(() => {
                    selectedCells = [];
                    renderGrid();
                }, 220);
            }
            return false;
        }

        function showVictory() {
            playVictoryFanfare();
            startConfetti();
            const modal = document.getElementById('victory-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function startNewGame() {
            stopConfetti();
            const modal = document.getElementById('victory-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            foundWords.clear();
            selectedCells = [];
            isDragging = false;
            dragMoved = false;

            document.getElementById('round-progress').textContent = `0/${WORDS_PER_GAME}`;

            const chosenWords = pickRandomWords();
            generateBoard(chosenWords);
            renderTargetCards();
            renderGrid();

            playPopSound(1);
        }

        /**
         * SISTEMA DE CONFETI ANIMADO EN CANVAS
         */
        let confettiParticles = [];
        let confettiAnimId = null;

        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = ['#F43F5E', '#38BDF8', '#FBBF24', '#34D399', '#A855F7', '#FB923C'];
            confettiParticles = Array.from({ length: 120 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                size: Math.random() * 10 + 6,
                color: colors[Math.floor(Math.random() * colors.length)],
                speedY: Math.random() * 4 + 2,
                speedX: Math.random() * 3 - 1.5,
                rotation: Math.random() * 360,
                rotSpeed: Math.random() * 8 - 4
            }));

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                confettiParticles.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.rotation += p.rotSpeed;

                    if (p.y > canvas.height) {
                        p.y = -20;
                        p.x = Math.random() * canvas.width;
                    }

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rotation * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                    ctx.restore();
                });
                confettiAnimId = requestAnimationFrame(animateConfetti);
            }

            animateConfetti();
        }

        function stopConfetti() {
            if (confettiAnimId) {
                cancelAnimationFrame(confettiAnimId);
                confettiAnimId = null;
            }
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Arrancar la primera partida al cargar la ventana
        window.onload = function () {
            startNewGame();
        };
    </script>
</body>
</html>
